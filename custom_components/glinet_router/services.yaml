send_sms:
  name: Send SMS
  description: Send an SMS through a supported GL.iNet cellular modem. The number and message are not logged or retained.
  fields:
    config_entry_id:
      name: Router
      description: Required only when more than one GL.iNet router is loaded.
      selector:
        config_entry:
          integration: glinet_router
    phone_number:
      name: Phone number
      description: >-
        Destination phone number in E.164 international format: +, country
        code, and digits only. For US and Canadian numbers, use +1 immediately
        followed by the 10-digit number. The integration passes this value to
        the router unchanged; it does not remove spaces, parentheses, or
        hyphens.
      required: true
      example: "+1XXXXXXXXXX"
      selector:
        text:
    message:
      name: Message
      description: SMS body. Maximum 160 characters, matching the GL.iNet WebUI limit.
      required: true
      selector:
        text:
          multiline: true

mark_sms_read:
  name: Mark SMS read
  description: Mark one received SMS as read on the selected GL.iNet router.
  fields:
    config_entry_id:
      name: Router
      description: Required only when more than one GL.iNet router is loaded.
      selector:
        config_entry:
          integration: glinet_router
    message_id:
      name: Message ID
      description: The message_id from a glinet_router_sms_received event.
      required: true
      selector:
        text:

delete_sms:
  name: Delete SMS
  description: Permanently delete one SMS from the selected GL.iNet router. This cannot be undone.
  fields:
    config_entry_id:
      name: Router
      description: Required only when more than one GL.iNet router is loaded.
      selector:
        config_entry:
          integration: glinet_router
    message_id:
      name: Message ID
      description: The message_id from a glinet_router_sms_received event.
      required: true
      selector:
        text:
